name: Build AM++ media plugin

on:
  workflow_dispatch:
  push:
    branches:
      - feature/sleep-timer-last-track

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37" "build-tools;37.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build plugin ZIP
        run: ./gradlew :media-plugin:testDebugUnitTest :media-plugin:lintDebug :media-plugin:pluginZip

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ampp-media-plugin-zip
          path: media-plugin/build/dist/*.zip
          if-no-files-found: error
