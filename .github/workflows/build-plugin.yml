name: Build AM++ media plugin

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          export PATH="$(dirname "$SDKMANAGER"):$(dirname "$(dirname "$SDKMANAGER")")/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --list > /tmp/android-sdk-packages.txt
          PLATFORM="$(grep -o 'platforms;android-37[^[:space:]]*' /tmp/android-sdk-packages.txt | sort -V | tail -1)"
          if [ -z "$PLATFORM" ]; then
            PLATFORM="platforms;android-36"
          fi
          echo "Selected Android platform: $PLATFORM"
          "$SDKMANAGER" "$PLATFORM" "build-tools;36.0.0"
          echo "ANDROID_PLATFORM=$PLATFORM" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build plugin ZIP
        run: ./gradlew :media-plugin:testDebugUnitTest :media-plugin:lintDebug :media-plugin:pluginZip

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ampp-media-plugin-zip
          path: media-plugin/build/dist/*.zip
          if-no-files-found: error

      - name: Publish direct plugin ZIP release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP_PATH="$(find media-plugin/build/dist -maxdepth 1 -name '*.zip' -print -quit)"
          TAG="v1.3.7-plugin-${GITHUB_SHA::7}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "$ZIP_PATH" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "AM++ Media Plugin 1.3.7 (${GITHUB_SHA::7})" \
            --notes "Directly importable AM++ plugin ZIP. Built from $GITHUB_SHA." \
            --prerelease
